<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="img/icono3.png">
    <title>LOG-IN - Crear Nueva Contraseña</title>

    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">

    <link href="css/custom.css" rel="stylesheet">
</head>

<body class="bg-gradient-sena body-forgot-password d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card o-hidden border-0 shadow-lg my-5 card-custom" style="background-color: #ffffff;">
                    <div class="card-body p-0">
                        <div class="row">
                            
                            <div class="col-md-4 d-flex justify-content-center align-items-center p-4" style="background-color: #ffffff;">
                                <a href="login.html">
                                    <img src="img/fondo.png" style="max-width: 200px; height: auto;" alt="Logo LOG-IN">
                                </a>
                            </div>
                            
                            <div class="col-lg-8" style="border-left: 1px solid #eaecf4;">
                                <div class="p-5">
                                    <div class="text-center">
                                        <h1 class="h3 text-gray-900 mb-2" style="font-weight: 700;">Establecer Nueva Contraseña</h1>
                                        <p class="mb-4 text-muted">Ingresa y confirma tu nueva credencial de acceso para el sistema.</p>
                                    </div>

                                    <form method="post" action="update-password.php" id="updatePasswordForm">
                                        
                                        <div class="form-group mb-3">
                                            <label for="newPassword" style="font-weight: 600; color: #4e73df;">Nueva Contraseña:</label>
                                            <input type="password" name="new_password" id="newPassword" placeholder="Mínimo 8 caracteres..." required class="form-control form-control-user" style="border-radius: 10px;">
                                        </div>

                                        <div class="form-group mb-4">
                                            <label for="confirmPassword" style="font-weight: 600; color: #4e73df;">Confirmar Contraseña:</label>
                                            <input type="password" name="confirm_password" id="confirmPassword" placeholder="Repite tu contraseña..." required class="form-control form-control-user" style="border-radius: 10px;">
                                        </div>

                                        <div class="mb-4 p-3" style="background-color: #f8f9fc; border-radius: 8px; border: 1px dashed #cbd5e1;">
                                            <p class="mb-2" style="font-size: 14px; color: #475569; font-weight: 600;">Tu contraseña necesita tener mínimo:</p>
                                            <ul class="list-unstyled m-0" style="font-size: 14px; color: #334155;">
                                                <li class="mb-1 d-flex align-items-center">
                                                    <i class="fas fa-times-circle text-secondary mr-2"></i> 1 mayúscula
                                                </li>
                                                <li class="mb-1 d-flex align-items-center">
                                                    <i class="fas fa-times-circle text-secondary mr-2"></i> 1 minúscula
                                                </li>
                                                <li class="mb-1 d-flex align-items-center">
                                                    <i class="fas fa-times-circle text-secondary mr-2"></i> 1 número
                                                </li>
                                                <li class="d-flex align-items-center">
                                                    <i class="fas fa-times-circle text-secondary mr-2"></i> 8 caracteres
                                                </li>
                                            </ul>
                                        </div>

                                        <button type="submit" class="btn btn-block" style="background-color: #4a738f; color: #ffffff; font-weight: 700; border-radius: 25px; padding: 10px 20px; border: none; transition: background-color 0.2s;">
                                            Actualizar Acceso
                                        </button>
                                    </form>
                                    
                                    <hr>
                                    
                                    <div id="passwordMessage" class="text-center mt-3"></div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("updatePasswordForm").addEventListener("submit", function (e) {
            let pass = document.getElementById("newPassword").value;
            let confirmPass = document.getElementById("confirmPassword").value;
            let feedback = document.getElementById("passwordMessage");

            if (pass !== confirmPass) {
                e.preventDefault();
                feedback.innerHTML = "<p class='text-danger' style='font-weight:600;'>❌ Las contraseñas ingresadas no coinciden.</p>";
                return;
            }

            if (pass.length < 8) {
                e.preventDefault();
                feedback.innerHTML = "<p class='text-danger' style='font-weight:600;'>❌ Por seguridad, la contraseña debe tener al menos 8 caracteres.</p>";
                return;
            }

            feedback.innerHTML = "<p class='text-success' style='font-weight:600;'>🔄 Guardando nueva contraseña de forma segura...</p>";
        });
    </script>
</body>
</html>
